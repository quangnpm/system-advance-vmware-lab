services:
  web:
    container_name: system-advance-web
    build:
      context: .
      target: runtime
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
