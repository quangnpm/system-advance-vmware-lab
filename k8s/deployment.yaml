apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-advance-web
  labels:
    app: system-advance-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: system-advance-web
  template:
    metadata:
      labels:
        app: system-advance-web
    spec:
      containers:
        - name: web
          image: system-advance-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
